<script>
// Option A: amber/blue columns and coral/sage rows. Further colors extend the pattern for three or four partitions.
const MODEL_PALETTE={
 cols:[[240,174,60],[95,148,230],[166,125,205],[81,173,175]],
 rows:[[226,109,146],[101,190,150],[136,151,203],[208,165,111]]
};
const toneInk=(kind,index)=>'rgb('+MODEL_PALETTE[kind][index%MODEL_PALETTE[kind].length].map(v=>Math.round(v*.58)).join(',')+')';
const toOKLab=(rgb)=>{
 const [r,g,b]=rgb.map(v=>v/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));

 return [.2104542553*l+.793617785*m-.0040720468*n,1.9779984951*l-2.428592205*m+.4505937099*n,.0259040371*l+.7827717662*m-.808675766*n];
};
const fromOKLab=(L,a,b)=>{
 const l=Math.pow(L+.3963377774*a+.2158037573*b,3),m=Math.pow(L-.1055613458*a-.0638541728*b,3),n=Math.pow(L-.0894841775*a-1.291485548*b,3);
 return [4.0767416621*l-3.3077115913*m+.2309699292*n,-1.2684380046*l+2.6097574011*m-.3413193965*n,-.0041960863*l-.7034186147*m+1.707614701*n]
 .map(v=>{v=Math.max(0,v);return Math.max(0,Math.min(255,Math.round(255*(v<=.0031308?12.92*v:1.055*Math.pow(v,1/2.4)-.055))))});
};
const tone=(kind,index)=>'rgb('+MODEL_PALETTE[kind][index%MODEL_PALETTE[kind].length].join(',')+')';
const toneSoft=(kind,index)=>'rgb('+MODEL_PALETTE[kind][index%MODEL_PALETTE[kind].length].map(v=>Math.round(v*.43+255*.57)).join(',')+')';
const mixedTone=(ri,ci)=>{
 const a=toOKLab(MODEL_PALETTE.rows[ri%MODEL_PALETTE.rows.length]),b=toOKLab(MODEL_PALETTE.cols[ci%MODEL_PALETTE.cols.length]);
 // Equal perceived lightness; moderate chroma for legible grid lines and navy text.

};
function drawDimensionArrows(svg,ns,origin,unit,top,left){
 const make=(tag,attrs)=>{const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));svg.appendChild(e);return e};
 const arrow=(x1,y1,x2,y2)=>{
  const horiz=y1===y2,head=9,half=4;
  make('line',{x1,y1,x2,y2,stroke:'#33485d','stroke-width':2.1});
  if(horiz){
   make('path',{d:'M'+(x1+head)+' '+(y1-half)+'L'+x1+' '+y1+'L'+(x1+head)+' '+(y1+half),fill:'none',stroke:'#33485d','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
   make('path',{d:'M'+(x2-head)+' '+(y2-half)+'L'+x2+' '+y2+'L'+(x2-head)+' '+(y2+half),fill:'none',stroke:'#33485d','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
  }else{
   make('path',{d:'M'+(x1-half)+' '+(y1+head)+'L'+x1+' '+y1+'L'+(x1+half)+' '+(y1+head),fill:'none',stroke:'#33485d','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
   make('path',{d:'M'+(x2-half)+' '+(y2-head)+'L'+x2+' '+y2+'L'+(x2+half)+' '+(y2-head),fill:'none',stroke:'#33485d','stroke-width':2,'stroke-linecap':'round','stroke-linejoin':'round'});
  }
 };
 const label=(x,y,value,color,size=27)=>{
  const e=make('text',{x,y,'text-anchor':'middle','dominant-baseline':'central','font-size':size,'font-weight':700,fill:color});
  e.textContent=textTerm(value);
 };
 let x=origin;
 top.forEach((part,ci)=>{
  const len=part.c*unit;
  if(part.c!==1&&len>=42)arrow(x+3,origin-18,x+len-3,origin-18);
  label(x+len/2,origin-49,part,toneInk('cols',ci),Math.min(27,Math.max(21,len/2)));
  x+=len;
 });
 let y=origin;
 left.forEach((part,ri)=>{
  const len=part.c*unit;
  if(part.c!==1&&len>=42)arrow(origin-18,y+3,origin-18,y+len-3);
  label(origin-54,y+len/2,part,toneInk('rows',ri),Math.min(30,Math.max(23,len/2)));
  y+=len;
 });
}
const $=id=>document.getElementById(id);let mode='squares',current=null;
const fmt=n=>String(n).replace(/^-/, '−');const signTerm=(c,p,first)=>{if(!c)return '';let s=c<0?'−':first?'':'+';let a=Math.abs(c);return s+(p?(a===1?'':a)+(p===2?'x²':'x'):a)};
function polyText(p){let out='';for(let i=2;i>=0;i--)if(p[i])out+=signTerm(p[i],i,!out);return out||'0'}
function parse(raw){let s=raw.replace(/\s/g,'').replace(/−/g,'-').replace(/\*/g,'').replace(/\(/g,'').replace(/\)/g,'');if(!s||!/^[+\-\dxX]+$/.test(s))throw Error('Use numbers and x, such as 34, 2x+3, or x−5.');s=s.replace(/X/g,'x').replace(/x/g,'x');if(!/^[+-]/.test(s))s='+'+s;let parts=s.match(/[+-][^+-]+/g)||[];let out=[0,0,0];for(let t of parts){let sign=t[0]==='-'?-1:1,v=t.slice(1);if(/^\d+$/.test(v))out[0]+=sign*Number(v);else if(/^(\d*)x$/.test(v))out[1]+=sign*Number(v.slice(0,-1)||1);else throw Error('Each factor can contain constants and x terms (no powers yet).')}if(!Number.isSafeInteger(out[0])||!Number.isSafeInteger(out[1]))throw Error('Number is too large.');return out}
function parts(p){if(p[1]){let a=[];if(p[1])a.push({c:p[1],pow:1});if(p[0])a.push({c:p[0],pow:0});return a}let n=p[0],sg=Math.sign(n)||1,abs=Math.abs(n);if(abs===0)return [{c:0,pow:0}];let digs=String(abs).split('').map((v,i)=>Number(v)*10**(String(abs).length-i-1)).filter(Boolean);return digs.map(c=>({c:c*sg,pow:0}))}
function textTerm(t){return polyText([t.pow===0?t.c:0,t.pow===1?t.c:0,t.pow===2?t.c:0])}
function product(a,b){return {c:a.c*b.c,pow:a.pow+b.pow}}
function result(p,q){return [p[0]*q[0],p[0]*q[1]+p[1]*q[0],p[1]*q[1]]}
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function cell(t){return safe(textTerm(t))}
function setMathText(node,value){node.innerHTML=safe(value).replace(/x/g,'<span class="math-variable">x</span>')}
function render(){
 if(!current)return;
 const {p,q,top,left,r}=current,hide=false;
 $('stage').innerHTML='';
 if(mode==='numeric')drawNumeric(top,left,hide);
 if(mode==='squares')drawSquares(top,left,hide);
 if(mode==='tiles')drawTiles(top,left,hide);
 if(mode==='algorithm')drawAlgorithm(p,q,top,left,hide);
 const terms=left.flatMap(l=>top.map(t=>product(l,t)));
 const formatSum=items=>items.join(' + ').replace(/\+ −/g,'− ');
 const expression='('+polyText(p)+')('+polyText(q)+') = '+formatSum(left.flatMap(l=>top.map(t=>textTerm(l)+'('+textTerm(t)+')')))+' = '+formatSum(terms.map(textTerm))+' = '+polyText(r);
 $('steps').innerHTML=safe(expression).replace(/x/g,'<span class="math-variable">x</span>');
}
function drawNumeric(top,left,hide){
 const stage=$('stage'),grid=document.createElement('div');grid.className='gridModel';
 // Use a compact, centered near-square table for multiple rows; keep a single row short and rectangular.
 // Allow long expressions to widen cells when needed, with scrolling as a last resort.
 const cols=top.length,rows=left.length;
 const longest=Math.max(...top.flatMap(t=>left.map(l=>'('+textTerm(l)+')('+textTerm(t)+')')).map(v=>v.length),5);
 const minCellWidth=Math.max(150,Math.min(340,Math.ceil(longest*15+32)));
 const headerWidth=72,headerHeight=64;
 const stageWidth=Math.max(300,(stage.clientWidth||1100)-24);
 const targetWidth=Math.max(headerWidth+cols*minCellWidth,Math.min(rows===1&&cols===1?390:630,stageWidth));
 const targetHeight=rows===1?headerHeight+150:Math.max(headerHeight+rows*112,Math.min(590,targetWidth*.91));
 const cellWidth=Math.max(minCellWidth,Math.round((targetWidth-headerWidth-4*cols)/cols));
 const cellHeight=rows===1?150:Math.max(112,Math.round((targetHeight-headerHeight-4*rows)/rows));
 grid.style.width='max-content';
 grid.style.maxWidth='none';
 grid.style.minWidth='0';
 grid.style.gridTemplateColumns=headerWidth+'px '+top.map(()=>cellWidth+'px').join(' ');
 grid.style.gridTemplateRows=headerHeight+'px '+left.map(()=>cellHeight+'px').join(' ');
 const add=(cls,txt,sub,bg)=>{
   const d=document.createElement('div');d.className=cls;
   if(bg)d.style.backgroundColor=bg;
   if(cls==='cell'){const strong=document.createElement('strong');setMathText(strong,txt);d.appendChild(strong);
     if(sub){const small=document.createElement('small');setMathText(small,sub);d.appendChild(small)}}
   else setMathText(d,txt);
   grid.appendChild(d);
 };
 add('head','·',null,'#e9edf1');top.forEach((t,ci)=>add('head',textTerm(t),null,tone('cols',ci)));
 left.forEach((l,ri)=>{add('head',textTerm(l),null,tone('rows',ri));top.forEach((t,ci)=>add('cell',hide?'?':textTerm(product(l,t)),'('+textTerm(l)+')('+textTerm(t)+')',mixedTone(ri,ci)))});

}
function drawSquares(top,left,hide){
 const numeric=top.every(t=>t.pow===0&&t.c>=0)&&left.every(t=>t.pow===0&&t.c>=0);
 if(!numeric){drawNumeric(top,left,hide);return}
 const w=top.reduce((s,t)=>s+t.c,0),h=left.reduce((s,t)=>s+t.c,0);
 if(!w||!h){$('stage').textContent='Zero area: '+w+' × '+h+' = 0';return}
 const origin=78,stage=$('stage'),available=Math.max(260,Math.min(1240,(stage.clientWidth||1200)-28));
 const viewportH=Number.isFinite(window.innerHeight)?window.innerHeight:900;
 const stageTop=stage.getBoundingClientRect?Math.max(140,stage.getBoundingClientRect().top):180;
 const steps=$('steps'),stepsHeight=steps.getBoundingClientRect?Math.max(74,steps.getBoundingClientRect().height):84;
 // Reserve room for the equation and panel margins; shrink the unit grid to fit the visible screen.
 const availableH=Math.max(230,Math.min(760,viewportH-stageTop-stepsHeight-44));
 const unit=Math.max(2.5,Math.min(180,(available-origin-12)/w,(availableH-origin-8)/h)),ns='http://www.w3.org/2000/svg';
 const svg=document.createElementNS(ns,'svg');svg.setAttribute('width',w*unit+origin+3);svg.setAttribute('height',h*unit+origin+3);
 svg.setAttribute('viewBox','0 0 '+(w*unit+origin+3)+' '+(h*unit+origin+3));svg.style.cssText='display:block;margin:auto;max-width:none';
 const add=(tag,attrs)=>{let e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,String(v)));svg.appendChild(e);return e};
 let y=origin;
 left.forEach((row,ri)=>{let x=origin;top.forEach((col,ci)=>{
  const ww=col.c*unit,hh=row.c*unit;
  add('rect',{x,y,width:ww,height:hh,fill:mixedTone(ri,ci)});
  if(unit>=2.5 && col.c<=140 && row.c<=140){const d=[];for(let j=1;j<col.c;j++)d.push('M'+(x+j*unit)+' '+y+'v'+hh);for(let j=1;j<row.c;j++)d.push('M'+x+' '+(y+j*unit)+'h'+ww);add('path',{d:d.join(' '),fill:'none',stroke:'#96acb9','stroke-width':Math.min(.65,unit*.17)})}
  add('rect',{x,y,width:ww,height:hh,fill:'none',stroke:'#344d66','stroke-width':2.2});
  if(ww>=34&&hh>=28){const t=add('text',{x:x+ww/2,y:y+hh/2,'dominant-baseline':'central','text-anchor':'middle',fill:'#263b50','font-size':Math.max(18,Math.min(34,Math.min(ww/2.5,hh/2.5))),'font-weight':700});t.textContent=hide?'?':String(row.c*col.c)}
  x+=ww;
 });y+=row.c*unit});

 const wrap=document.createElement('div');wrap.style.cssText='overflow:auto;max-width:100%';wrap.appendChild(svg);$('stage').appendChild(wrap);
 
}
function drawTiles(top,left,hide){
 const stage=$('stage');const p=current.p,q=current.q;
 if(!p[1]&&!q[1]&&p[0]>=0&&q[0]>=0){
  const bands=n=>{let a=[];for(let i=0;i<Math.floor(n/10);i++)a.push(10);for(let i=0;i<n%10;i++)a.push(1);return a};

  const colors={hundred:'#a9cbed',ten:'#c4e2d7',one:'#f5d99c'};

 const factorTiles=(v)=>{let arr=[];if(v[1])for(let i=0;i<Math.abs(v[1]);i++)arr.push({pow:1,sign:Math.sign(v[1])});if(v[0])for(let i=0;i<Math.abs(v[0]);i++)arr.push({pow:0,sign:Math.sign(v[0])});return arr};

 d.appendChild(span);return d};
 const corner=document.createElement('div');corner.textContent='·';corner.style.cssText='display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;position:relative';place(corner,1,1);const cornerH=document.createElement('div');cornerH.style.cssText='background:#24394e;margin-right:-3px';place(cornerH,2,1);const cornerV=document.createElement('div');cornerV.style.cssText='background:#24394e;margin-bottom:-3px';place(cornerV,1,2);

function drawAlgorithm(p,q,top,left,hide){

 const add=(value,bg,bold)=>{const line=document.createElement('div');line.className='alg-line';setMathText(line,value);if(bg)line.style.backgroundColor=bg;if(bold)line.style.fontWeight='700';d.appendChild(line)};
 const rule=()=>{const line=document.createElement('div');line.className='alg-rule';d.appendChild(line)};
 const factorLine=(value,groups,axis,prefix)=>{
  const line=document.createElement('div');line.className='alg-line';line.style.fontWeight='700';
  if(prefix){line.appendChild(document.createTextNode(prefix))}
  const digits=String(value),raw=digits.replace('-','');let position=0;

    if(/[0-9]/.test(character)){
      const exp=raw.length-1-position;
      const amount=Number(character)*10**exp;
      const idx=groups.findIndex(t=>t.pow===0&&Math.abs(t.c)===amount);
      span.style.color=idx>=0?toneInk(axis,idx):'#52667c';

  }

 };
 if(!p[1]&&!q[1]&&Number.isInteger(p[0])&&Number.isInteger(q[0])){

// Count every physical piece, including the two outside edges.
// Keep algebra tiles limited to layouts students can actually distinguish.
function reasonableAlgebraTiles(p,q){

        edgeUnits(p)<=36&&edgeUnits(q)<=36;
}

  const unavailable=(btn.dataset.mode==='squares'&&!allowSquares)||
                    (btn.dataset.mode==='tiles'&&!allowTiles);
  btn.hidden=unavailable;
  btn.disabled=unavailable;
 });

}
function build(){

  current={p,q,top:parts(q),left:parts(p),r:result(p,q)};

document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{
